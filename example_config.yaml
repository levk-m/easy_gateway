# Easy-Gateway example config.
# Only routes[].path and routes[].target are required; everything else is optional.

server:
  host: "0.0.0.0"
  port: 8000

redis:
  enabled: true                    # disable to run without Redis (caching off)
  url: "redis://localhost:6379"
  expire_time: 300                 # cache TTL, seconds (default: 180)

routes:
  # Prefix route: /bin/<x> is proxied to <target>/<x>.
  # Use a trailing "/*" and a full URL target.
  - path: "/bin/*"
    target: "https://httpbin.org/"
    description: "HTTPBin playground"
    cache: true                    # cache successful GET responses (default: false)

  # Exact route: matches /users only. The target must NOT contain a path —
  # the route path is appended to it automatically.
  - path: "/users"
    target: "https://api.example.com"
    description: "Exact route demo"

  - path: "/pets/*"
    target: "https://petstore.swagger.io/"
    description: "Pets service"
    cache: true

  # Exact route against a real API: /jokes/random -> https://api.chucknorris.io/jokes/random
  - path: "/jokes/random"
    target: "https://api.chucknorris.io"
    description: "Random joke endpoint"
    cache: true

middlewares:
  - name: "LoggingMiddleware"
    enabled: true

  - name: "RateLimitMiddleware"
    requests_per_minute: 30        # default: 60

cors:
  allow_origins:                   # defaults to ["*"] if omitted
    - "https://myfront.com"
    - "https://testreact.space"

admin:                             # defaults to admin / admin — change in production
  username: "admin"
  password: "admin"
