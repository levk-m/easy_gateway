[build-system]
requires = ["setuptools>=61.0,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-gateway"
version = "0.1.14"
description = "Simple to use and fast Gateway for python developers"
readme = "README.md"
authors = [
    {name = "Mark", email = "levmarkpost@gmail.com"}
]

license = {text = "MIT"}

keywords = ["api", "gateway", "fastapi", "proxy", "microservices"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.127.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "PyYAML==6.0.3",
    "redis==7.1.0",
    "uvicorn[standard]==0.40.0",
    "uvloop==0.22.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
easy-gateway = "easy_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/MarkLevkovich/easy_gateway"


[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.20",
]
